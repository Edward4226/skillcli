<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>skillcli · 控制平面看板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #fff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-soft: #475569;
      --muted: #94a3b8;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --verified: #16a34a;
      --verified-soft: #dcfce7;
      --review: #d97706;
      --review-soft: #fef3c7;
      --blocked: #dc2626;
      --blocked-soft: #fee2e2;
      --dead: #94a3b8;
      --dup: #7c3aed;
      --dup-soft: #ede9fe;
      --shadow: 0 1px 3px rgba(15,23,42,.04), 0 1px 2px rgba(15,23,42,.06);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      margin: 0; background: var(--bg); color: var(--text);
      font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      font-size: .92em; background: #f1f5f9; padding: 1px 6px; border-radius: 3px;
    }
    mark { background: #fef3c7; padding: 0 2px; border-radius: 2px; }
    button, input, select { font-family: inherit; font-size: inherit; }
    button { cursor: pointer; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ====================== header ====================== */
    header {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 14px 32px; position: sticky; top: 0; z-index: 100;
      box-shadow: var(--shadow);
    }
    .header-top {
      display: flex; align-items: center; justify-content: space-between;
      max-width: 1500px; margin: 0 auto 12px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo { font-size: 22px; }
    .brand-title { margin: 0; font-size: 16px; font-weight: 600; }
    .brand-tag { color: var(--muted); font-size: 11px; }
    .header-meta { display: flex; align-items: center; gap: 14px; color: var(--text-soft); font-size: 12px; }
    .refresh-btn {
      padding: 5px 12px; border: 1px solid var(--border); background: var(--card);
      color: var(--text); border-radius: 6px; font-size: 12px;
      transition: all .15s;
    }
    .refresh-btn:hover { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
    .tabs {
      display: flex; gap: 4px; max-width: 1500px; margin: 0 auto;
    }
    .tab {
      padding: 8px 18px; border: 0; background: transparent; color: var(--text-soft);
      border-bottom: 2px solid transparent; font-size: 14px; font-weight: 500;
      transition: all .12s;
    }
    .tab:hover { color: var(--primary); }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
    .tab-badge { display: inline-block; margin-left: 6px; padding: 1px 7px;
                  background: var(--blocked-soft); color: var(--blocked);
                  border-radius: 9px; font-size: 11px; font-weight: 700; }

    /* ====================== layout ====================== */
    .container { max-width: 1500px; margin: 0 auto; padding: 24px 32px 48px; }
    .panel {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid var(--border);
    }
    .panel-title { margin: 0; font-size: 14px; font-weight: 600; color: var(--text); }
    .empty { padding: 32px; text-align: center; color: var(--muted); font-size: 13px; }

    /* ====================== Overview tab ====================== */
    .overview-hero {
      display: grid; grid-template-columns: 280px 1fr; gap: 18px;
      margin-bottom: 18px;
    }
    @media (max-width: 920px) { .overview-hero { grid-template-columns: 1fr; } }
    .health-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px; box-shadow: var(--shadow); text-align: center;
      position: relative; overflow: hidden;
    }
    .health-card::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, var(--health-color, var(--primary-soft)) 0%, transparent 60%);
      opacity: .3; pointer-events: none;
    }
    .health-score {
      font-size: 56px; font-weight: 700; line-height: 1; margin-top: 8px;
      color: var(--health-color, var(--text)); position: relative;
    }
    .health-tag { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    .health-detail { color: var(--text-soft); font-size: 12px; margin-top: 12px; position: relative; }

    .today-list {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: var(--shadow); padding: 16px 18px; min-height: 200px;
    }
    .today-list h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--text-soft); }
    .today-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid #f1f5f9;
    }
    .today-item:last-child { border-bottom: none; }
    .today-icon { font-size: 18px; line-height: 1; }
    .today-body { flex: 1; min-width: 0; }
    .today-skill { font-weight: 500; font-size: 13px; }
    .today-why { color: var(--text-soft); font-size: 12px; margin-top: 2px; }
    .today-link { font-size: 12px; }

    .summary {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px; margin-bottom: 18px;
    }
    .stat {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 16px; box-shadow: var(--shadow);
    }
    .stat-label { color: var(--text-soft); font-size: 11px; text-transform: uppercase;
                   letter-spacing: .04em; font-weight: 600; }
    .stat-value { font-size: 26px; font-weight: 700; margin-top: 4px; line-height: 1; }
    .stat-sub { color: var(--muted); font-size: 11px; margin-top: 4px; }
    .stat.ok .stat-value { color: var(--verified); }
    .stat.warn .stat-value { color: var(--review); }
    .stat.alert .stat-value { color: var(--blocked); }

    .charts {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px;
    }
    @media (max-width: 920px) { .charts { grid-template-columns: 1fr; } }
    .chart-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 16px; box-shadow: var(--shadow);
    }
    .chart-card h3 { margin: 0 0 10px; font-size: 12px; color: var(--text-soft); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .chart-wrap { position: relative; height: 200px; }

    .disclaimer {
      background: var(--review-soft); border: 1px solid #fcd34d; border-radius: 8px;
      padding: 12px 16px; font-size: 12.5px; color: #78350f; line-height: 1.6;
      margin-bottom: 18px;
    }
    .disclaimer strong { color: var(--review); }

    /* ====================== Library tab ====================== */
    .library-layout {
      display: grid; grid-template-columns: 260px 1fr; gap: 18px;
    }
    @media (max-width: 920px) { .library-layout { grid-template-columns: 1fr; } }
    .facet-sidebar {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      box-shadow: var(--shadow); padding: 16px; align-self: flex-start;
      position: sticky; top: 110px; max-height: calc(100vh - 130px); overflow-y: auto;
    }
    .facet-group { margin-bottom: 18px; }
    .facet-group:last-child { margin-bottom: 0; }
    .facet-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: var(--text-soft); margin-bottom: 8px;
    }
    .facet-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 13px;
      transition: background .1s;
    }
    .facet-item:hover { background: #f8fafc; }
    .facet-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
    .facet-count { color: var(--muted); font-size: 12px; }
    .facet-item.active .facet-count { color: var(--primary); }
    .facet-clear {
      display: block; width: 100%; padding: 6px; margin-top: 12px;
      background: transparent; border: 1px solid var(--border); border-radius: 4px;
      color: var(--text-soft); font-size: 12px;
    }
    .facet-clear:hover { background: var(--blocked-soft); color: var(--blocked); border-color: var(--blocked); }

    .library-main {}
    .library-header {
      display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 16px; box-shadow: var(--shadow); margin-bottom: 12px;
    }
    .search-wrap { flex: 1; min-width: 220px; position: relative; }
    .search-input {
      width: 100%; padding: 8px 14px 8px 36px; border: 1px solid var(--border);
      border-radius: 6px;
    }
    .search-input:focus { outline: none; border-color: var(--primary); }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .sort-select {
      padding: 7px 12px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--card);
    }
    .compare-toggle {
      display: flex; align-items: center; gap: 6px; padding: 7px 12px;
      border: 1px solid var(--border); border-radius: 6px; background: var(--card);
      color: var(--text-soft); font-size: 13px;
    }
    .compare-toggle.on { background: var(--dup-soft); color: var(--dup); border-color: var(--dup); }

    .result-meta { color: var(--text-soft); font-size: 12px; margin: 0 0 8px 4px; }
    .result-chips {
      display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px;
    }
    .result-chip {
      background: var(--primary-soft); color: var(--primary); padding: 2px 9px;
      border-radius: 10px; font-size: 11px; font-weight: 500;
      display: flex; align-items: center; gap: 4px;
    }
    .result-chip .x {
      cursor: pointer; opacity: .6; padding: 0 2px;
    }
    .result-chip .x:hover { opacity: 1; }

    .skill-list {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; box-shadow: var(--shadow); overflow: hidden;
    }
    .skill-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto auto auto auto;
      gap: 14px; align-items: center;
      padding: 11px 16px; border-bottom: 1px solid #f1f5f9;
      cursor: pointer; transition: background .1s;
    }
    .skill-row:last-child { border-bottom: none; }
    .skill-row:hover { background: #f8fafc; }
    .skill-row.expanded { background: var(--primary-soft); }
    .skill-row.selected { background: var(--dup-soft); }
    .skill-checkbox { accent-color: var(--dup); cursor: pointer; }
    .skill-info { min-width: 0; }
    .skill-name { font-weight: 500; font-size: 14px; overflow: hidden;
                    text-overflow: ellipsis; white-space: nowrap; }
    .skill-summary { color: var(--text-soft); font-size: 12px; margin-top: 2px;
                      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .skill-tags { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
    .tag-chip {
      background: #f1f5f9; color: var(--text-soft); padding: 1px 7px;
      border-radius: 8px; font-size: 10px;
    }
    .badge {
      display: inline-block; padding: 2px 9px; border-radius: 10px;
      font-size: 11px; font-weight: 600; white-space: nowrap;
    }
    .badge-verified { background: var(--verified-soft); color: var(--verified); }
    .badge-needs-review { background: var(--review-soft); color: var(--review); }
    .badge-blocked { background: var(--blocked-soft); color: var(--blocked); }
    .badge-unverified { background: #f1f5f9; color: var(--muted); }
    .badge-dup { background: var(--dup-soft); color: var(--dup); }
    .tool-chip {
      padding: 2px 7px; border-radius: 8px; font-size: 11px; font-weight: 500;
      background: #e0f2fe; color: #0369a1; white-space: nowrap;
    }
    .tool-chip.codex { background: #fef3c7; color: #92400e; }
    .usage-cell { font-size: 12px; color: var(--text-soft); white-space: nowrap; }
    .usage-explicit { color: var(--verified); font-weight: 600; }
    .usage-implicit { color: var(--dup); }
    .usage-na { color: var(--muted); }
    .freshness { font-size: 11px; color: var(--muted); white-space: nowrap; }

    .skill-detail {
      padding: 14px 18px 16px; background: #fafbfc;
      border-bottom: 1px solid #f1f5f9; font-size: 13px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    }
    @media (max-width: 800px) { .skill-detail { grid-template-columns: 1fr; } }
    .detail-block h4 { margin: 0 0 6px; font-size: 11px; color: var(--text-soft);
                        text-transform: uppercase; letter-spacing: .04em; }
    .detail-block .kv { margin-bottom: 4px; color: var(--text-soft); }
    .detail-block .kv b { color: var(--text); font-weight: 500; }
    .detail-block .desc { background: var(--card); border: 1px solid var(--border);
                          padding: 8px 10px; border-radius: 4px;
                          max-height: 160px; overflow-y: auto;
                          white-space: pre-wrap; word-break: break-word; }

    /* compare dialog */
    .compare-dialog {
      position: fixed; inset: 0; background: rgba(15,23,42,.5);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .compare-content {
      background: var(--card); border-radius: 12px; max-width: 1100px; width: 92%;
      max-height: 86vh; overflow: auto; padding: 24px;
    }
    .compare-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    .compare-table th, .compare-table td {
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      text-align: left; vertical-align: top; font-size: 13px;
    }
    .compare-table th {
      width: 130px; color: var(--text-soft); font-weight: 500; font-size: 12px;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .compare-table td.diff { background: var(--review-soft); }
    .compare-close {
      float: right; padding: 6px 14px; border: 1px solid var(--border); background: var(--card);
      border-radius: 6px;
    }

    /* ====================== Issues tab ====================== */
    .issues-controls {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 16px; box-shadow: var(--shadow); margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .sev-pills { display: flex; gap: 6px; }
    .sev-pill {
      padding: 5px 11px; border: 1px solid var(--border); background: var(--card);
      color: var(--text-soft); border-radius: 14px; font-size: 12px;
    }
    .sev-pill.active.high { background: var(--blocked); color: white; border-color: var(--blocked); }
    .sev-pill.active.med { background: var(--review); color: white; border-color: var(--review); }
    .sev-pill.active.low { background: var(--text-soft); color: white; border-color: var(--text-soft); }
    .sev-pill.active.all { background: var(--primary); color: white; border-color: var(--primary); }

    .issue-group {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden;
    }
    .issue-group-header {
      padding: 13px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; cursor: pointer;
      background: #fafbfc;
    }
    .issue-group-icon { font-size: 18px; line-height: 1; }
    .issue-group-title { margin: 0; font-size: 14px; font-weight: 600; flex: 1; }
    .issue-group-count { color: var(--muted); font-size: 12px; }
    .issue-group-body { padding: 0; }
    .issue-group-body.collapsed { display: none; }

    .issue-card {
      display: grid; grid-template-columns: auto 1fr auto; gap: 12px;
      padding: 14px 18px; border-bottom: 1px solid #f1f5f9; align-items: start;
    }
    .issue-card:last-child { border-bottom: none; }
    .issue-card .checkbox { accent-color: var(--primary); margin-top: 4px; }
    .issue-skill {
      font-weight: 500; font-size: 13px; margin-bottom: 4px;
    }
    .issue-skill .badge { margin-left: 8px; }
    .issue-why { color: var(--text-soft); font-size: 12.5px; margin-bottom: 6px; }
    .issue-fix {
      background: var(--primary-soft); border-left: 3px solid var(--primary);
      padding: 8px 12px; font-size: 12.5px; border-radius: 0 4px 4px 0;
      color: #1e3a8a; line-height: 1.55;
    }
    .issue-fix b { color: var(--primary); }
    .issue-jump {
      padding: 4px 10px; font-size: 11px; border: 1px solid var(--border);
      background: var(--card); border-radius: 4px; color: var(--text-soft); white-space: nowrap;
    }
    .issue-jump:hover { color: var(--primary); border-color: var(--primary); }

    .bulk-bar {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--text); color: white; padding: 12px 20px;
      border-radius: 10px; display: flex; align-items: center; gap: 14px;
      box-shadow: 0 8px 24px rgba(15,23,42,.2); z-index: 200;
    }
    .bulk-bar button {
      padding: 6px 14px; background: white; color: var(--text);
      border: 0; border-radius: 6px; font-size: 13px; font-weight: 500;
    }

    #toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 12px 18px; background: var(--text); color: white;
      border-radius: 6px; font-size: 13px;
      transform: translateY(80px); opacity: 0; transition: all .25s; z-index: 999;
    }
    #toast.show { transform: translateY(0); opacity: 1; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div class="brand">
        <span class="brand-logo">📊</span>
        <div>
          <div class="brand-title">skillcli · 控制平面看板</div>
          <div class="brand-tag">本地只读 · 100% offline</div>
        </div>
      </div>
      <div class="header-meta">
        <span id="last-scan">加载中...</span>
        <button class="refresh-btn" onclick="loadAll(true)">🔄 刷新</button>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="overview">概览</button>
      <button class="tab" data-tab="library">Skill 库</button>
      <button class="tab" data-tab="issues">问题清单 <span id="issues-tab-badge" class="tab-badge hidden">0</span></button>
    </nav>
  </header>

  <main class="container">
    <div id="content"><div class="empty">⏳ 加载数据中...</div></div>
  </main>

  <div id="bulk-bar" class="bulk-bar hidden">
    <span id="bulk-count">已选 0 条</span>
    <button onclick="bulkDryRun()">生成 dry-run 报告</button>
    <button onclick="clearBulk()" style="background:transparent;color:white;border:1px solid white;">清空</button>
  </div>

  <div id="toast"></div>

  <script>
    // ============================ state ============================
    let regData = {skills: {}, saved_at: null};
    let sugData = {suggestions: []};
    let tagsData = {tags: []};
    let issuesData = {issues: [], stats: {}};

    let currentTab = 'overview';
    // Library filters: 多选 (Set) — AND across facet groups, OR within group
    const libFilters = {
      badges: new Set(),
      tools: new Set(),
      scopes: new Set(),
      tags: new Set(),
      usage: new Set(),       // active / dead / never-tracked
      freshness: new Set(),   // 7 / 30 / 90 / old
    };
    let librarySearch = '';
    let sortBy = 'default';   // default / name / score / last_used
    let compareMode = false;
    const selectedForCompare = new Set();
    const expandedIds = new Set();

    // Issues
    let issuesSeverity = 'all';     // all / high / med / low
    const collapsedIssueGroups = new Set();
    const bulkSelected = new Set();

    const charts = {};

    // ============================ bootstrap ============================
    async function loadAll(notify) {
      try {
        const [reg, sug, tags, iss] = await Promise.all([
          fetch('/api/registry.json').then(r => r.json()),
          fetch('/api/suggestions.json').then(r => r.json()),
          fetch('/api/tags.json').then(r => r.json()),
          fetch('/api/issues.json').then(r => r.json()),
        ]);
        regData = reg || {skills: {}};
        sugData = sug || {suggestions: []};
        tagsData = tags || {tags: []};
        issuesData = iss || {issues: [], stats: {}};
        renderAll();
        if (notify) toast('已刷新');
      } catch (e) {
        document.getElementById('content').innerHTML =
          `<div class="empty">❌ 加载失败：${escape(String(e))}</div>`;
      }
    }
    const getSkills = () => Object.values(regData.skills || {});

    // ============================ render dispatch ============================
    function renderAll() {
      updateLastScan();
      updateIssuesTabBadge();
      renderTab(currentTab);
      bindTabClicks();
    }
    function renderTab(tab) {
      const c = document.getElementById('content');
      if (getSkills().length === 0) {
        c.innerHTML = renderEmptyState();
        return;
      }
      if (tab === 'overview') c.innerHTML = renderOverview();
      else if (tab === 'library') c.innerHTML = renderLibrary();
      else c.innerHTML = renderIssues();
      attachTabEvents(tab);
      if (tab === 'overview') drawCharts();
      updateBulkBar();
    }
    function bindTabClicks() {
      document.querySelectorAll('.tab').forEach(btn => {
        btn.onclick = () => switchTab(btn.dataset.tab);
      });
    }
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      renderTab(tab);
    }
    function updateLastScan() {
      const el = document.getElementById('last-scan');
      if (regData.saved_at) {
        try { el.textContent = '上次扫描: ' + new Date(regData.saved_at).toLocaleString('zh-CN'); }
        catch { el.textContent = '上次扫描: 未知'; }
      } else el.textContent = '请先 skillcli scan';
    }
    function updateIssuesTabBadge() {
      const high = (issuesData.stats || {})['severity/high'] || 0;
      const med = (issuesData.stats || {})['severity/med'] || 0;
      const total = high + med;
      const el = document.getElementById('issues-tab-badge');
      if (total === 0) { el.classList.add('hidden'); return; }
      el.classList.remove('hidden');
      el.textContent = String(total);
    }

    // ============================ empty state ============================
    function renderEmptyState() {
      return `<div class="empty">
        🌱 注册表是空的。<br><br>
        请先在终端运行：<br>
        <code>skillcli scan</code> 发现本地 skill；<br>
        <code>skillcli verify --all</code> 跑质量门；<br>
        <code>skillcli usage</code> 算用量。<br><br>
        然后回到这里 🔄 刷新。
      </div>`;
    }

    // ============================ Overview tab ============================
    function renderOverview() {
      const skills = getSkills();
      const total = skills.length;
      const verified = skills.filter(s => s.verify.badge === 'verified').length;
      const review = skills.filter(s => s.verify.badge === 'needs-review').length;
      const blocked = skills.filter(s => s.verify.badge === 'blocked').length;
      const used = skills.filter(s => (s.usage.invocations || 0) > 0 || (s.usage.implicit_mentions || 0) > 0).length;
      const dead = skills.filter(s =>
        s.usage.source === 'claude_jsonl' &&
        (s.usage.invocations || 0) === 0 &&
        (s.usage.implicit_mentions || 0) === 0
      ).length;
      const dups = skills.filter(s => s.duplicate_of).length;
      const claudeN = skills.filter(s => s.tool === 'claude').length;
      const codexN = skills.filter(s => s.tool === 'codex').length;
      const pct = (n) => total === 0 ? 0 : Math.round(n / total * 100);

      // 健康分公式：verified×0.5 + (1 - blocked/total)×0.3 + (1 - dead/total)×0.2
      const verifiedRatio = total ? verified / total : 0;
      const safetyRatio = total ? 1 - blocked / total : 1;
      const aliveRatio = total ? 1 - dead / total : 1;
      const health = Math.round((verifiedRatio * 0.5 + safetyRatio * 0.3 + aliveRatio * 0.2) * 100);
      const healthColor = health >= 80 ? 'var(--verified)' : health >= 60 ? 'var(--review)' : 'var(--blocked)';

      // 今日 3 件最该处理的事 — 取严重度 high+med 的前 3 条
      const todayItems = (issuesData.issues || [])
        .filter(i => i.severity === 'high' || i.severity === 'med')
        .slice(0, 3);

      return `
        <div class="overview-hero">
          <div class="health-card" style="--health-color: ${healthColor}">
            <div class="health-tag">健康分</div>
            <div class="health-score">${health}</div>
            <div class="health-detail">Verified ${pct(verified)}% · 安全 ${pct(total - blocked)}% · 活跃 ${pct(total - dead)}%</div>
          </div>
          <div class="today-list">
            <h3>📌 今天 3 件最该处理</h3>
            ${todayItems.length === 0
              ? '<div class="empty" style="padding:24px;">✨ 没有 high/med 待办——干净。</div>'
              : todayItems.map(i => `
                <div class="today-item">
                  <span class="today-icon">${sevIcon(i.severity)}</span>
                  <div class="today-body">
                    <div class="today-skill">${escape(i.skill_id)} <span class="badge badge-${i.severity === 'high' ? 'blocked' : 'needs-review'}">${i.type}</span></div>
                    <div class="today-why">${escape(i.why)}</div>
                  </div>
                  <a class="today-link" onclick="switchTab('issues')" href="#">→ 看清单</a>
                </div>`).join('')}
          </div>
        </div>

        <div class="summary">
          <div class="stat"><div class="stat-label">总 Skill</div>
            <div class="stat-value">${total}</div>
            <div class="stat-sub">Claude ${claudeN} · Codex ${codexN}</div></div>
          <div class="stat ok"><div class="stat-label">✅ Verified</div>
            <div class="stat-value">${verified}</div><div class="stat-sub">${pct(verified)}%</div></div>
          <div class="stat warn"><div class="stat-label">⚠️ Needs Review</div>
            <div class="stat-value">${review}</div><div class="stat-sub">${pct(review)}%</div></div>
          <div class="stat alert"><div class="stat-label">❌ Blocked</div>
            <div class="stat-value">${blocked}</div><div class="stat-sub">安全/结构问题</div></div>
          <div class="stat"><div class="stat-label">📈 用量</div>
            <div class="stat-value">${used}</div><div class="stat-sub">显式或隐式 (30天)</div></div>
          <div class="stat"><div class="stat-label">💀 死重 / 🔁 重复</div>
            <div class="stat-value">${dead}<span style="font-size:18px;color:var(--muted);"> / ${dups}</span></div>
            <div class="stat-sub">建议清理</div></div>
        </div>

        <div class="charts">
          <div class="chart-card"><h3>按 verify 徽章分布</h3><div class="chart-wrap"><canvas id="badge-chart"></canvas></div></div>
          <div class="chart-card"><h3>按主题 tag 分布</h3><div class="chart-wrap"><canvas id="tag-chart"></canvas></div></div>
        </div>

        <div class="disclaimer">
          <strong>⚠️ 用量信号说明</strong>　Claude 的显式 <code>Skill</code> tool_use 在真实使用中很<strong>稀疏</strong>——多数 skill 是被加载进 context 后<strong>隐式使用</strong>。本看板显示<strong>显式调用</strong>（精确）与<strong>隐式提及</strong>（text-scan 启发式 ≥5 字符名、词边界、可能误报）。Codex skill 的用量统计当前不支持（标 <code>—</code>）。
        </div>
      `;
    }

    function drawCharts() {
      const skills = getSkills();
      const byBadge = {verified: 0, 'needs-review': 0, blocked: 0, unverified: 0};
      skills.forEach(s => byBadge[s.verify.badge] = (byBadge[s.verify.badge] || 0) + 1);
      drawDoughnut('badge-chart', {
        labels: ['Verified', 'Needs Review', 'Blocked', 'Unverified'],
        data: [byBadge.verified, byBadge['needs-review'], byBadge.blocked, byBadge.unverified],
        colors: ['#16a34a', '#d97706', '#dc2626', '#cbd5e1'],
      });
      const tags = (tagsData.tags || []).slice(0, 10);
      drawDoughnut('tag-chart', {
        labels: tags.map(t => t.name),
        data: tags.map(t => t.count),
        colors: ['#2563eb','#7c3aed','#10b981','#f59e0b','#ec4899','#06b6d4','#8b5cf6','#f43f5e','#84cc16','#0ea5e9'],
      });
    }
    function drawDoughnut(id, {labels, data, colors}) {
      const ctx = document.getElementById(id);
      if (!ctx) return;
      if (charts[id]) charts[id].destroy();
      charts[id] = new Chart(ctx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data, backgroundColor: colors, borderColor: '#fff', borderWidth: 2 }] },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '60%',
          plugins: { legend: { position: 'right', labels: { font: { size: 11 }, boxWidth: 12 } } },
        },
      });
    }

    // ============================ Library tab ============================
    function renderLibrary() {
      const skills = getSkills();
      const filtered = filterAndSort(skills);
      return `
        <div class="library-layout">
          <aside class="facet-sidebar">
            ${renderFacetGroup('状态', 'badges', countBy(skills, s => s.verify.badge), badgeLabel)}
            ${renderFacetGroup('工具', 'tools', countBy(skills, s => s.tool))}
            ${renderFacetGroup('Scope', 'scopes', countBy(skills, s => s.scope))}
            ${renderFacetGroup('主题', 'tags', tagCounts(skills))}
            ${renderFacetGroup('用量', 'usage', usageStateCounts(skills), usageStateLabel)}
            ${renderFacetGroup('新鲜度', 'freshness', freshnessCounts(skills), freshnessLabel)}
            <button class="facet-clear" onclick="clearLibFilters()">清空筛选</button>
          </aside>
          <div class="library-main">
            <div class="library-header">
              <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input class="search-input" id="search" placeholder="搜索 name / summary / description / 触发词..."
                       value="${escape(librarySearch)}">
              </div>
              <select class="sort-select" id="sort-select">
                <option value="default" ${sortBy === 'default' ? 'selected' : ''}>默认（blocked 优先 + 用量）</option>
                <option value="name" ${sortBy === 'name' ? 'selected' : ''}>按名字</option>
                <option value="score" ${sortBy === 'score' ? 'selected' : ''}>按 verify score</option>
                <option value="last_used" ${sortBy === 'last_used' ? 'selected' : ''}>按上次使用</option>
                <option value="freshness" ${sortBy === 'freshness' ? 'selected' : ''}>按新鲜度</option>
              </select>
              <button class="compare-toggle ${compareMode ? 'on' : ''}" id="compare-toggle">
                ${compareMode ? '🔁 比较模式' : '🔁 开启比较'}
              </button>
              ${compareMode && selectedForCompare.size === 2
                ? '<button class="compare-toggle on" id="do-compare">📋 对比这两个</button>' : ''}
            </div>
            <div class="result-meta">${filtered.length} / ${skills.length} 个匹配</div>
            ${renderActiveChips()}
            <div class="skill-list" id="skill-list">${renderSkillRows(filtered)}</div>
          </div>
        </div>
      `;
    }

    function renderFacetGroup(title, key, counts, labelFn) {
      labelFn = labelFn || (v => v);
      const items = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      if (items.length === 0) return '';
      const active = libFilters[key];
      return `
        <div class="facet-group">
          <div class="facet-title">${title}</div>
          ${items.map(([k, n]) => `
            <div class="facet-item ${active.has(k) ? 'active' : ''}" data-facet="${key}" data-key="${escape(k)}">
              <span>${escape(labelFn(k))}</span>
              <span class="facet-count">${n}</span>
            </div>
          `).join('')}
        </div>
      `;
    }
    const badgeLabel = (k) => ({verified: '✅ verified', 'needs-review': '⚠️ needs-review', blocked: '❌ blocked', unverified: '· unverified'}[k] || k);
    const usageStateLabel = (k) => ({active: '📈 active', dead: '💀 dead', 'never-tracked': '🆕 never-tracked'}[k] || k);
    const freshnessLabel = (k) => ({'<7d': '< 7 天', '<30d': '< 30 天', '<90d': '< 90 天', 'old': '> 90 天'}[k] || k);

    function countBy(items, fn) {
      const c = {};
      for (const x of items) {
        const k = fn(x);
        if (k != null) c[k] = (c[k] || 0) + 1;
      }
      return c;
    }
    function tagCounts(items) {
      const c = {};
      for (const s of items) {
        for (const t of (s.tags || [])) c[t] = (c[t] || 0) + 1;
      }
      return c;
    }
    function usageStateCounts(items) {
      const c = {active: 0, dead: 0, 'never-tracked': 0};
      for (const s of items) {
        const u = s.usage || {};
        if (u.source === 'unsupported' || u.source === 'unknown') c['never-tracked']++;
        else if ((u.invocations || 0) > 0 || (u.implicit_mentions || 0) > 0) c.active++;
        else c.dead++;
      }
      return c;
    }
    function freshnessCounts(items) {
      const c = {'<7d': 0, '<30d': 0, '<90d': 0, 'old': 0};
      for (const s of items) {
        const d = s.freshness_days;
        if (d == null) continue;
        if (d < 7) c['<7d']++;
        else if (d < 30) c['<30d']++;
        else if (d < 90) c['<90d']++;
        else c.old++;
      }
      return c;
    }

    function renderActiveChips() {
      const chips = [];
      for (const [grp, set] of Object.entries(libFilters)) {
        for (const v of set) chips.push({grp, v, label: chipLabel(grp, v)});
      }
      if (librarySearch) chips.push({grp: '_search', v: '_', label: `搜索: ${librarySearch}`});
      if (chips.length === 0) return '';
      return `<div class="result-chips">${chips.map(c => `
        <span class="result-chip">${escape(c.label)}<span class="x" data-grp="${escape(c.grp)}" data-v="${escape(c.v)}">×</span></span>
      `).join('')}</div>`;
    }
    function chipLabel(grp, v) {
      const grpLabel = {badges: '状态', tools: '工具', scopes: 'scope', tags: '主题', usage: '用量', freshness: '新鲜度'}[grp] || grp;
      const valueLabel = grp === 'badges' ? badgeLabel(v) : grp === 'usage' ? usageStateLabel(v) : grp === 'freshness' ? freshnessLabel(v) : v;
      return `${grpLabel}: ${valueLabel}`;
    }

    function filterAndSort(skills) {
      const q = librarySearch.toLowerCase().trim();
      const out = skills.filter(s => {
        if (libFilters.badges.size && !libFilters.badges.has(s.verify.badge)) return false;
        if (libFilters.tools.size && !libFilters.tools.has(s.tool)) return false;
        if (libFilters.scopes.size && !libFilters.scopes.has(s.scope)) return false;
        if (libFilters.tags.size) {
          const skillTags = new Set(s.tags || []);
          let ok = false;
          for (const t of libFilters.tags) if (skillTags.has(t)) { ok = true; break; }
          if (!ok) return false;
        }
        if (libFilters.usage.size) {
          const u = s.usage || {};
          let cat;
          if (u.source === 'unsupported' || u.source === 'unknown') cat = 'never-tracked';
          else if ((u.invocations || 0) > 0 || (u.implicit_mentions || 0) > 0) cat = 'active';
          else cat = 'dead';
          if (!libFilters.usage.has(cat)) return false;
        }
        if (libFilters.freshness.size) {
          const d = s.freshness_days;
          let cat = 'old';
          if (d != null) {
            if (d < 7) cat = '<7d'; else if (d < 30) cat = '<30d';
            else if (d < 90) cat = '<90d'; else cat = 'old';
          }
          if (!libFilters.freshness.has(cat)) return false;
        }
        if (q) {
          const score = relevanceScore(s, q);
          if (score === 0) return false;
          s._score = score;
        } else s._score = 0;
        return true;
      });
      sortSkills(out);
      return out;
    }

    function relevanceScore(s, q) {
      // multi-token AND: each token must match somewhere
      const tokens = q.split(/\s+/).filter(Boolean);
      let totalScore = 0;
      for (const tok of tokens) {
        const inName = (s.name || '').toLowerCase().includes(tok);
        const inSummary = (s.summary || '').toLowerCase().includes(tok);
        const inDescription = (s.description || '').toLowerCase().includes(tok);
        const inKw = (s.trigger_keywords || []).some(k => k.toLowerCase().includes(tok));
        const inTag = (s.tags || []).some(t => t.toLowerCase().includes(tok));
        const inId = (s.id || '').toLowerCase().includes(tok);
        if (!(inName || inSummary || inDescription || inKw || inTag || inId)) return 0;
        let tokScore = 0;
        if (inName) tokScore += 3;
        if (inTag) tokScore += 2;
        if (inKw) tokScore += 2;
        if (inSummary) tokScore += 1;
        if (inDescription) tokScore += 1;
        if (inId) tokScore += 0.5;
        totalScore += tokScore;
      }
      return totalScore;
    }

    function sortSkills(arr) {
      if (sortBy === 'name') arr.sort((a, b) => a.name.localeCompare(b.name));
      else if (sortBy === 'score') arr.sort((a, b) => (b.verify.score || 0) - (a.verify.score || 0));
      else if (sortBy === 'last_used') arr.sort((a, b) => {
        const la = a.usage.last_used || '0';
        const lb = b.usage.last_used || '0';
        return lb.localeCompare(la);
      });
      else if (sortBy === 'freshness') arr.sort((a, b) => (a.freshness_days ?? 9999) - (b.freshness_days ?? 9999));
      else {
        // default: 搜索时按 _score 降序；否则 badge 优先 + 用量
        if (librarySearch) arr.sort((a, b) => (b._score || 0) - (a._score || 0));
        else {
          const rank = {blocked: 0, 'needs-review': 1, verified: 2, unverified: 3};
          arr.sort((a, b) => {
            const r = (rank[a.verify.badge] ?? 9) - (rank[b.verify.badge] ?? 9);
            if (r !== 0) return r;
            const ua = (a.usage.invocations || 0) * 10 + (a.usage.implicit_mentions || 0);
            const ub = (b.usage.invocations || 0) * 10 + (b.usage.implicit_mentions || 0);
            if (ua !== ub) return ub - ua;
            return a.name.localeCompare(b.name);
          });
        }
      }
    }

    function renderSkillRows(skills) {
      if (skills.length === 0) return '<div class="empty">没有匹配的 skill。试改 filter 或搜索词。</div>';
      const limit = 200;
      const shown = skills.slice(0, limit);
      let html = shown.map(s => {
        const isExp = expandedIds.has(s.id);
        const isSel = selectedForCompare.has(s.id);
        return `
          <div class="skill-row ${isExp ? 'expanded' : ''} ${isSel ? 'selected' : ''}" data-id="${escape(s.id)}">
            ${compareMode
              ? `<input type="checkbox" class="skill-checkbox" data-id="${escape(s.id)}" ${isSel ? 'checked' : ''}>`
              : '<span style="width:14px"></span>'}
            <div class="skill-info">
              <div class="skill-name">${highlight(s.name, librarySearch)}${s.duplicate_of ? ' <span class="badge badge-dup">🔁</span>' : ''}</div>
              <div class="skill-summary">${highlight(s.summary || '(no summary)', librarySearch)}</div>
              ${(s.tags || []).length ? `<div class="skill-tags">${s.tags.map(t => `<span class="tag-chip">${escape(t)}</span>`).join('')}</div>` : ''}
            </div>
            <span class="badge badge-${s.verify.badge}">${s.verify.badge}</span>
            <span class="tool-chip ${s.tool}">${s.tool}</span>
            <span style="color:var(--muted);font-size:11px;">${s.scope}</span>
            <div class="usage-cell" title="explicit / implicit (30d)">${usageCellHTML(s)}</div>
            <div class="freshness" title="last modified">${freshnessDisplay(s.freshness_days)}</div>
          </div>
          ${isExp ? renderDetail(s) : ''}
        `;
      }).join('');
      if (skills.length > limit) {
        html += `<div class="empty" style="padding:10px;">仅显示前 ${limit} 条；用 filter / 搜索缩小范围看其余 ${skills.length - limit} 条。</div>`;
      }
      return html;
    }
    function usageCellHTML(s) {
      if (s.usage.source === 'unsupported') return '<span class="usage-na">—</span>';
      const ex = s.usage.invocations || 0;
      const im = s.usage.implicit_mentions || 0;
      return `<span class="usage-explicit">${ex}</span><span class="usage-na">/</span><span class="usage-implicit">${im}</span>`;
    }
    function freshnessDisplay(d) {
      if (d == null) return '—';
      if (d === 0) return '今日';
      if (d < 30) return d + 'd';
      if (d < 365) return Math.round(d / 30) + 'mo';
      return Math.round(d / 365) + 'y';
    }
    function renderDetail(s) {
      const kws = (s.trigger_keywords || []).join(', ') || '(none)';
      const tags = (s.tags || []).join(', ') || '(none)';
      return `
        <div class="skill-detail">
          <div class="detail-block">
            <h4>verify</h4>
            <div class="kv">badge: <b>${s.verify.badge}</b> · score <b>${s.verify.score || 0}/100</b></div>
            <div class="kv">last_run: <b>${s.verify.last_run || '—'}</b></div>
            <h4 style="margin-top:10px;">触发关键词</h4>
            <div class="kv">${escape(kws)}</div>
            <h4 style="margin-top:10px;">主题 tag</h4>
            <div class="kv">${escape(tags)}</div>
          </div>
          <div class="detail-block">
            <h4>usage (30d)</h4>
            <div class="kv">source: <b>${s.usage.source}</b></div>
            <div class="kv">显式调用: <b>${s.usage.invocations || 0}</b> · last_used <b>${s.usage.last_used || '—'}</b></div>
            <div class="kv">隐式提及: <b>${s.usage.implicit_mentions || 0}</b> （text-scan 启发式）</div>
            <h4 style="margin-top:10px;">path</h4>
            <div class="kv"><code style="font-size:10px;">${escape(s.path || '')}</code></div>
            ${s.duplicate_of ? `<div class="kv" style="color:var(--dup);margin-top:6px;">🔁 duplicate of <b>${escape(s.duplicate_of)}</b></div>` : ''}
            <h4 style="margin-top:10px;">description (full)</h4>
            <div class="desc">${escape(s.description || '(empty)')}</div>
          </div>
        </div>
      `;
    }
    function highlight(text, q) {
      if (!q || !text) return escape(text || '');
      const tokens = q.trim().split(/\s+/).filter(Boolean);
      if (!tokens.length) return escape(text);
      let out = escape(text);
      for (const tok of tokens) {
        const re = new RegExp('(' + tok.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
        out = out.replace(re, '<mark>$1</mark>');
      }
      return out;
    }

    // ============================ Issues tab ============================
    function renderIssues() {
      const issues = (issuesData.issues || []).filter(i => issuesSeverity === 'all' || i.severity === issuesSeverity);
      const grouped = {};
      for (const i of issues) (grouped[i.type] = grouped[i.type] || []).push(i);
      const typeOrder = ['security', 'trigger_style', 'duplicate', 'dead', 'stale'];
      const sortedTypes = Object.keys(grouped).sort((a, b) => {
        const ai = typeOrder.indexOf(a); const bi = typeOrder.indexOf(b);
        return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
      });
      const total = issues.length;
      const stats = issuesData.stats || {};
      return `
        <div class="issues-controls">
          <div>
            <span style="font-weight:600;">${total} 条 issue</span>
            <span style="color:var(--muted);margin-left:8px;font-size:12px;">
              high ${stats['severity/high'] || 0} · med ${stats['severity/med'] || 0} · low ${stats['severity/low'] || 0}
            </span>
          </div>
          <div class="sev-pills">
            <button class="sev-pill ${issuesSeverity === 'all' ? 'active all' : ''}" data-sev="all">全部</button>
            <button class="sev-pill ${issuesSeverity === 'high' ? 'active high' : ''}" data-sev="high">🚨 high</button>
            <button class="sev-pill ${issuesSeverity === 'med' ? 'active med' : ''}" data-sev="med">⚠️ med</button>
            <button class="sev-pill ${issuesSeverity === 'low' ? 'active low' : ''}" data-sev="low">💤 low</button>
          </div>
        </div>
        ${sortedTypes.length === 0
          ? '<div class="empty">✨ 没有 issue。整个库都干净。</div>'
          : sortedTypes.map(t => renderIssueGroup(t, grouped[t])).join('')}
      `;
    }
    function renderIssueGroup(type, items) {
      const collapsed = collapsedIssueGroups.has(type);
      return `
        <div class="issue-group">
          <div class="issue-group-header" data-group="${escape(type)}">
            <span class="issue-group-icon">${typeIcon(type)}</span>
            <h3 class="issue-group-title">${typeLabel(type)}</h3>
            <span class="issue-group-count">${items.length} 条</span>
            <span style="color:var(--muted);">${collapsed ? '▾' : '▴'}</span>
          </div>
          <div class="issue-group-body ${collapsed ? 'collapsed' : ''}">
            ${items.map(i => `
              <div class="issue-card">
                <input type="checkbox" class="checkbox" data-issue-id="${escape(i.skill_id + '|' + i.type)}" ${bulkSelected.has(i.skill_id + '|' + i.type) ? 'checked' : ''}>
                <div>
                  <div class="issue-skill">
                    ${escape(i.skill_id)}
                    <span class="badge badge-${i.severity === 'high' ? 'blocked' : i.severity === 'med' ? 'needs-review' : 'unverified'}">${i.severity}</span>
                  </div>
                  <div class="issue-why">${escape(i.why)}</div>
                  <div class="issue-fix"><b>怎么修：</b>${escape(i.how_to_fix)}</div>
                </div>
                <button class="issue-jump" data-jump="${escape(i.skill_id)}">→ 看详情</button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }
    function typeIcon(t) { return {security: '🚨', trigger_style: '⚠️', duplicate: '🔁', dead: '💀', stale: '📅'}[t] || '·'; }
    function typeLabel(t) { return {security: '安全/结构问题', trigger_style: '触发式描述待改', duplicate: '重复 skill', dead: '死重 (30 天无信号)', stale: '长期未更新'}[t] || t; }
    function sevIcon(s) { return {high: '🚨', med: '⚠️', low: '💤'}[s] || '·'; }

    // ============================ events ============================
    function attachTabEvents(tab) {
      if (tab === 'library') {
        document.querySelectorAll('.facet-item').forEach(el => {
          el.onclick = () => {
            const f = el.dataset.facet; const k = el.dataset.key;
            const set = libFilters[f];
            if (set.has(k)) set.delete(k); else set.add(k);
            renderTab('library');
          };
        });
        const search = document.getElementById('search');
        if (search) {
          search.addEventListener('input', e => {
            librarySearch = e.target.value;
            // Re-render only the right-side list (not facets) for perf
            const filtered = filterAndSort(getSkills());
            document.querySelector('.result-meta').textContent = `${filtered.length} / ${getSkills().length} 个匹配`;
            document.getElementById('skill-list').innerHTML = renderSkillRows(filtered);
            attachSkillRowEvents();
            // active chips include search now
            const oldChips = document.querySelector('.result-chips');
            if (oldChips) oldChips.remove();
            const html = renderActiveChips();
            if (html) document.querySelector('.result-meta').insertAdjacentHTML('afterend', html);
            attachChipEvents();
          });
        }
        const sortSel = document.getElementById('sort-select');
        if (sortSel) sortSel.onchange = (e) => { sortBy = e.target.value; renderTab('library'); };
        const cmpBtn = document.getElementById('compare-toggle');
        if (cmpBtn) cmpBtn.onclick = () => {
          compareMode = !compareMode;
          if (!compareMode) selectedForCompare.clear();
          renderTab('library');
        };
        const doCmp = document.getElementById('do-compare');
        if (doCmp) doCmp.onclick = () => openCompareDialog();
        attachSkillRowEvents();
        attachChipEvents();
      }
      if (tab === 'issues') {
        document.querySelectorAll('.sev-pill').forEach(p => {
          p.onclick = () => { issuesSeverity = p.dataset.sev; renderTab('issues'); };
        });
        document.querySelectorAll('.issue-group-header').forEach(h => {
          h.onclick = () => {
            const g = h.dataset.group;
            if (collapsedIssueGroups.has(g)) collapsedIssueGroups.delete(g);
            else collapsedIssueGroups.add(g);
            renderTab('issues');
          };
        });
        document.querySelectorAll('.issue-card .checkbox').forEach(cb => {
          cb.onclick = (e) => {
            e.stopPropagation();
            const k = cb.dataset.issueId;
            if (cb.checked) bulkSelected.add(k); else bulkSelected.delete(k);
            updateBulkBar();
          };
        });
        document.querySelectorAll('.issue-jump').forEach(b => {
          b.onclick = (e) => {
            e.stopPropagation();
            const id = b.dataset.jump;
            expandedIds.add(id);
            switchTab('library');
          };
        });
      }
    }
    function attachSkillRowEvents() {
      document.querySelectorAll('.skill-row').forEach(row => {
        row.onclick = (e) => {
          if (e.target.tagName === 'INPUT') return;
          const id = row.dataset.id;
          if (expandedIds.has(id)) expandedIds.delete(id); else expandedIds.add(id);
          renderTab('library');
        };
      });
      document.querySelectorAll('.skill-checkbox').forEach(cb => {
        cb.onclick = (e) => {
          e.stopPropagation();
          const id = cb.dataset.id;
          if (cb.checked) {
            if (selectedForCompare.size >= 2) {
              const first = selectedForCompare.values().next().value;
              selectedForCompare.delete(first);
            }
            selectedForCompare.add(id);
          } else selectedForCompare.delete(id);
          renderTab('library');
        };
      });
    }
    function attachChipEvents() {
      document.querySelectorAll('.result-chip .x').forEach(x => {
        x.onclick = () => {
          const g = x.dataset.grp; const v = x.dataset.v;
          if (g === '_search') { librarySearch = ''; }
          else { libFilters[g].delete(v); }
          renderTab('library');
        };
      });
    }
    function clearLibFilters() {
      for (const set of Object.values(libFilters)) set.clear();
      librarySearch = '';
      renderTab('library');
    }

    // ============================ Compare dialog ============================
    function openCompareDialog() {
      const ids = [...selectedForCompare];
      if (ids.length !== 2) return;
      const a = regData.skills[ids[0]]; const b = regData.skills[ids[1]];
      const fields = [
        ['ID', a.id, b.id],
        ['Name', a.name, b.name],
        ['Tool / scope', a.tool + '/' + a.scope, b.tool + '/' + b.scope],
        ['Badge', a.verify.badge, b.verify.badge],
        ['Score', a.verify.score, b.verify.score],
        ['Summary', a.summary, b.summary],
        ['Description', a.description, b.description],
        ['Trigger kw', (a.trigger_keywords || []).join(', '), (b.trigger_keywords || []).join(', ')],
        ['Tags', (a.tags || []).join(', '), (b.tags || []).join(', ')],
        ['Explicit invocations', a.usage.invocations || 0, b.usage.invocations || 0],
        ['Implicit mentions', a.usage.implicit_mentions || 0, b.usage.implicit_mentions || 0],
        ['Freshness', a.freshness_days, b.freshness_days],
        ['Duplicate of', a.duplicate_of || '—', b.duplicate_of || '—'],
        ['Path', a.path, b.path],
      ];
      const rows = fields.map(([label, va, vb]) => {
        const same = String(va) === String(vb);
        return `<tr>
          <th>${escape(label)}</th>
          <td class="${same ? '' : 'diff'}">${escape(String(va || ''))}</td>
          <td class="${same ? '' : 'diff'}">${escape(String(vb || ''))}</td>
        </tr>`;
      }).join('');
      const dialog = document.createElement('div');
      dialog.className = 'compare-dialog';
      dialog.innerHTML = `
        <div class="compare-content">
          <button class="compare-close">关闭</button>
          <h2 style="margin:0 0 8px;">📋 比较 2 个 skill</h2>
          <p style="color:var(--text-soft);font-size:13px;">差异字段标黄高亮。重复 skill 选一个保留即可。</p>
          <table class="compare-table"><tbody>${rows}</tbody></table>
        </div>
      `;
      dialog.onclick = (e) => { if (e.target === dialog) dialog.remove(); };
      dialog.querySelector('.compare-close').onclick = () => dialog.remove();
      document.body.appendChild(dialog);
    }

    // ============================ Bulk dry-run ============================
    function updateBulkBar() {
      const bar = document.getElementById('bulk-bar');
      const n = bulkSelected.size;
      if (n === 0) { bar.classList.add('hidden'); return; }
      bar.classList.remove('hidden');
      document.getElementById('bulk-count').textContent = `已选 ${n} 条 issue`;
    }
    function clearBulk() { bulkSelected.clear(); updateBulkBar(); renderTab(currentTab); }
    function bulkDryRun() {
      const items = [];
      for (const k of bulkSelected) {
        const [sid, type] = k.split('|');
        const e = regData.skills[sid];
        if (!e) continue;
        items.push({ sid, type, name: e.name, path: e.path });
      }
      const report = `# Dry-run 报告\n\n选中 ${items.length} 条 issue。\n\n` +
        items.map(i => `- [${i.type}] ${i.sid}\n  path: ${i.path}\n  建议: 见 Issues tab 的"怎么修"\n`).join('\n');
      const blob = new Blob([report], {type: 'text/markdown'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'skillcli-dry-run.md'; a.click();
      URL.revokeObjectURL(url);
      toast('已生成 dry-run.md 报告并下载');
    }

    // ============================ utils ============================
    function escape(s) {
      if (s == null) return '';
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 1800);
    }

    loadAll();
  </script>
</body>
</html>
